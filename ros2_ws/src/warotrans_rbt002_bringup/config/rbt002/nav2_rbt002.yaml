# RBT-002 Nav2 overlay: applied LAST (after core nav2_params.yaml, filters, EKF and lane-aware overlays).
# Only what differs from RBT-001. docs/calibration.md §1 for the geometry.
#  * turning centre = chassis centre (RBT-001's is 0.05 m behind its chassis centre)
#  * outer size incl. wheels: length 0.30 m (Hiwonder chassis), width 0.263 m (track 0.215 + wheel 0.048)
#  * wheel speed limit: firmware JGB528 preset 1.1 rps = 0.335 m/s; cruise 0.30 m/s (RBT-001: 0.35)
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.30
    FollowPathReverse:
      desired_linear_vel: 0.18

velocity_smoother:
  ros__parameters:
    max_velocity: [0.30, 0.0, 0.6]
    min_velocity: [-0.18, 0.0, -0.6]

local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.15, 0.132], [0.15, -0.132], [-0.15, -0.132], [-0.15, 0.132]]"

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.15, 0.132], [0.15, -0.132], [-0.15, -0.132], [-0.15, 0.132]]"

# BackUp / Spin start only with clearance in this box (warotrans_fleet recovery_guard; RBT-001: 0.16 x 0.13).
recovery_guard:
  ros__parameters:
    half_length: 0.15
    half_width: 0.132
    padding: 0.02

# 2026-11-26 lab (MAP-ONE-V027): on a loaded Pi (load 9-11) recovery_guard's guarded_backup action server was not
# seen within the core 5 s, bt_navigator failed to load its tree and Nav2 never came up ("Action server is inactive").
bt_navigator:
  ros__parameters:
    wait_for_service_timeout: 30000
